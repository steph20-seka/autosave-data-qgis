name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - name: Vérifier que le tag correspond à metadata.txt
        run: |
          v=$(grep '^version=' autosave_data/metadata.txt | cut -d= -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} différent de la version $v"; exit 1; }
      - run: python scripts/build_zip.py
      - name: Publier la release et joindre le ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "AutoSave Data ${GITHUB_REF_NAME}" --generate-notes
          fi
